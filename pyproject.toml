[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openlibrary-automation"
version = "1.0.0"
description = "Asynchronous Open Library research, analytics, caching, and reporting CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lab 4 Capstone" }]
dependencies = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "platformdirs>=4.2,<5",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.5,<1",
]

[project.scripts]
openlibrary = "openlibrary_automation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openlibrary_automation"]

[tool.pytest.ini_options]
addopts = "-q --cov=openlibrary_automation --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
